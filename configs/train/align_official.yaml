# 与官方 robbyant/lingbot-vla-v2-6b-robotwin/lingbotvla_cli.yaml 的 train.align_params 逐项一致（D-04）。
# 路径字段用 {model_root} 占位，由 src/launch_train.py 填充。
mode: query
num_task_tokens: 8
depth_loss_weight: 0.004
future_depth_loss_weight: 0.004
use_future_video: true
llm:
  dim_out: 2560
  image_token_size: 8
  image_input_size: 224
depth:
  model_type: MoRGBD
  moge_path: "{model_root}/moge-2-vitb-normal/model.pt"
  morgbd_path: "{model_root}/robbyant_lingbot-vla-v2-6b/depth/model.pt"
  num_layers: 1
  num_heads: 4
  dim_head: 32
  ff_mult: 1
  num_backbone_tokens: 256
  token_size: 16
  dim_out: 1024
  input_size: 224
  use_future_depth: true
  block_future_depth_to_action: false
  detach_future_image_feats: true
video:
  ckpt_path: "{model_root}/robbyant_lingbot-vla-v2-6b/dino_video/teacher_step_10000.pth"
  config_path: "{model_root}/robbyant_lingbot-vla-v2-6b/dino_video/config.yaml"
  attention_mode: flex_block_causal
  input_size: 256
  block_suffix_to_future_video: false
  share_future_depth_query: true
  use_shared_future_task_proj: true
  use_current_shared_task_proj: true
  num_future_frames: 1
  use_warmup_frame: true
  effective_fps: 1.0
  n_blocks: 1
  cls_pool: last
  detach_image_feats: true
  num_layers: 1
  num_heads: 4
  dim_head: 32
  ff_mult: 1
  num_backbone_tokens: 256
  dim_out: 1024
  future_video_loss_weight: 0.004
  use_smooth_l1_loss: false
  use_mse_loss: true
  mse_loss_weight: 1.0
  use_patch_loss: true
  use_current_patch_loss: true
  use_cosine_loss: true
  cosine_loss_weight: 0.2
  use_cls_loss: false
  cls_loss_type: mse
  cls_loss_weight: 0.2
  log_max_samples: 32
  log_scale: 16
visual_steps: 5000
